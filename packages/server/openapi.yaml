        * POST /api/codemods/apply
           * Body: { projectId: string, changes: [{filePath, modified}], selectedFiles?: string[] }
           * Returns: { applied: string[], skipped: string[] }
           *
           * `projectId` is required: the service uses the project's repo path as a
           * security boundary and refuses to write to any path outside it.
      tags:
        - codemods
      operationId: post_api_codemods_apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                changes:
                  type: array
                  items:
                    type: object
                    properties:
                      filePath:
                        type: string
                      modified:
                        type: string
                    required:
                      - filePath
                      - modified
                selectedFiles:
                  type: array
                  items:
                    type: string
              required:
