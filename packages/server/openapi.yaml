openapi: 3.1.0
info:
  title: agentic-kanban REST API
  version: 0.1.9
  description: "Auto-generated from Hono route source via scripts/generate-openapi.ts. Schemas are inferred statically (best-effort) — a request body comes from the zod schema passed to `parseJsonBody(c, schema)` where there is one, otherwise from the `parseJsonBody<T>` type argument; response bodies are untyped. Coverage is audited: see x-coverage for what is scanned and what is deliberately not described here."
servers:
  - url: /
    description: "Same-origin (default dev: http://localhost:3001)"
x-coverage:
  scanned:
    - src/routes/*.ts
    - src/startup/app-bootstrap.ts
    - src/startup/route-setup.ts
    - src/server-start.ts
  notDocumented:
    - where: src/startup/route-setup.ts (`*`)
      reason: SPA fallback - serves the client bundle for any path the API did not match. Not an API operation, and `*` is not expressible as an OpenAPI path.
    - where: src/services/fleet-listener.service.ts
      reason: A SEPARATE Hono app on KANBAN_FLEET_PORT (worker register/heartbeat/ws + the fleet MCP bridge), never mounted on the board API. It has its own bearer-token auth and its own surface; documenting its paths here would claim they exist on the board port, where they do not.
  requestBodies:
    mechanism: "A route validating its body calls `parseJsonBody(c, schema)` with a zod schema from the sibling `routes/*-body-schemas.ts` (#512/#806). That schema is read statically: each field's primitive, whether it is required, a length bound, and whether unknown keys are kept (`x-unknown-keys`) or stripped."
    limitations:
      - "An operation described only as `additionalProperties: true` with NO property list parses its body WITHOUT a schema (`parseJsonBody(c)` / `parseOptionalJsonBody(c)`) or does not parse one at all. That is an omission the route has not closed yet, not a claim that the endpoint accepts any object."
      - "`x-unknown-keys: stripped` means zod DROPS unknown keys before the handler sees them; the request itself is still accepted, which is why additionalProperties stays true."
      - A zod predicate is deliberately weaker than the type it carries (`arrayOnly` is `Array.isArray` and nothing more), so an array's ITEM schema is the declared type, not something the server enforces.
  errorResponses:
    mechanism: Routes built on `createRouter()` install `domainErrorHandler`, which maps a thrown error's domain code to a status (DOMAIN_CODE_STATUS) and echoes the code in the body as `{ error, code }`.
    derivedFrom: Statuses are attributed by statically following `throw new ...` from each handler up to 2 call(s) deep, mapping the code through the tables parsed from `middleware/error-handler.ts` and `errors/index.ts`.
    limitations:
      - "Attribution stops at 2 hops from the handler: an error thrown deeper in a service call chain is NOT documented here. The bound is deliberate - unbounded following would attach a plumbing helper's 404 to every route that can reach it."
      - A call whose target cannot be resolved syntactically (a callback parameter, a dynamically dispatched method, anything imported from another package) is not followed, so statuses it can throw are absent.
      - "Every operation may additionally answer 500: domainErrorHandler's final branch renders any unrecognised error as `{ error }` with status 500. That is not listed per-operation because it is true of all of them."
      - A throw inside a `try` whose `catch` contains no `throw` is treated as swallowed and is not attributed.
paths:
  /api/agent-skills:
    get:
      summary: GET /api/agent-skills — list skills
      tags:
        - agent-skills
      operationId: get_api_agent-skills
      parameters:
