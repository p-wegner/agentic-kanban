  /api/merge-queue:
    post:
      summary: |-
        * POST /api/merge-queue
           *
           * body: { workspaceIds: string[], dryRun?: boolean, skipOnConflict?: boolean, strategy?: "sequential" | "train" }
           *
           * - dryRun: true  → returns JSON plan (sorted order + conflict matrix + per-workspace conflictPreviews)
           * - dryRun: false → streams SSE events while executing the queue
           * - strategy: explicit override; "sequential" always wins, "train" opts in regardless of
           *   project defaults. Omitted → `executeQueue` decides (classifier recommendation or the
           *   project's `train_max_size` opt-in, #904).
      tags:
        - merge-queue
      operationId: post_api_merge-queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceIds:
                  type: array
                  items:
                    type: string
                dryRun:
                  type: boolean
                skipOnConflict:
                  type: boolean
                strategy:
                  type: string
                  enum:
                    - sequential
                    - train
              required:
                - workspaceIds
              additionalProperties: true
              x-unknown-keys: passthrough
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {}
        "400":
          description: Error (thrown HTTPException, status from domainErrorHandler)
          content:
            application/json:
              schema: {}
