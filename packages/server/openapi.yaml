          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {}
    post:
      summary: POST /api/agent-skills — create a skill
      tags:
        - agent-skills
      operationId: post_api_agent-skills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                prompt:
                  type: string
                model:
                  type: string
                projectId:
                  type: string
                  nullable: true
                isInit:
                  type: boolean
              required:
                - name
                - description
                - prompt
              additionalProperties: true
              x-unknown-keys: passthrough
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: {}
        "400":
          description: Error (thrown BAD_REQUEST, HTTPException, status from domainErrorHandler)
          content:
            application/json:
              schema: {}
        "409":
          description: Error (thrown CONFLICT, status from domainErrorHandler)
          content:
            application/json:
              schema: {}
