packages:
  - "packages/*"

# Security overrides — force patched versions of vulnerable TRANSITIVE deps
# (npm audit --prod highs/moderates). Each package resolves to a single major in
# our tree, so a plain override is safe; brace-expansion is scoped to @2 because a
# 1.x line is also present (forcing all of it to 2.x would break the 1.x consumers).
#   fast-uri      high  — path traversal / host confusion (via @modelcontextprotocol/sdk>ajv)
#   ws            high  — DoS + uninitialized-memory disclosure (via @libsql/client)
#   brace-expansion high — DoS via exponential expansion (via ts-morph>minimatch)
#   ip-address    moderate — XSS in Address6 HTML methods
#   qs            moderate — remotely-triggerable stringify DoS
overrides:
  # hono is also pulled transitively by @modelcontextprotocol/sdk at 4.12.16 (< the
  # direct bump in packages/server), so override it too — fixes the high CORS-reflect
  # and moderate CSS-injection advisories and dedupes to one 4.x version.
  #
  # Pinned EXACTLY, and it must stay in step with packages/server/package.json (#761):
  # an override replaces the direct dependency's spec too, so a caret range here would
  # silently outrank that exact pin and the manifest would stop describing what installs.
  # 4.12.34 clears GHSA-8j4g-w8fx-2239, GHSA-f23p-vx2j-j53r, GHSA-54fx-42gc-7vw4 (CORS
  # and Language middleware ReDoS, memo() SSR leak) and GHSA-79qm-7rj5-m7r9.
  hono: "4.12.34"
  # @hono/node-server is BOTH a direct dependency of packages/server and a transitive
  # dependency of @modelcontextprotocol/sdk (which declares ^1.19.9 and had resolved to
  # 1.19.14). Bumping only the direct dep therefore left the vulnerable copy in the
  # PRODUCTION graph, so this is overridden and pinned exactly for the same reason as
  # hono above — keep it in step with packages/server/package.json (#761).
  # 1.19.15 fixes GHSA-frvp-7c67-39w9, a Windows path traversal in serve-static; this
  # board serves its client through that handler and Windows is its primary platform.
  "@hono/node-server": "1.19.17"
  fast-uri: "^3.1.2"
  ws: "^8.21.0"
  "brace-expansion@2": "^2.1.2"
  ip-address: "^10.1.1"
  qs: "^6.15.2"

# Always fetch the win32-x64 native binaries (rollup/esbuild/swc) in addition to
# the host platform's, so a lockfile produced on one OS installs cleanly on
# another. Replaces the old hard devDependency on @rollup/rollup-win32-x64-msvc,
# which made `pnpm install` fail outright on macOS/Linux (unsupported platform).
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64

# Moved here from package.json's "pnpm" field, which pnpm no longer reads — it was
# being silently ignored and warned about on every command.
onlyBuiltDependencies:
  - esbuild
  - "@swc/core"

# Peer conflicts we have checked and are knowingly accepting.
#
#   zod — @anthropic-ai/claude-agent-sdk declares `zod: ^4.0.0` as a peer while this
#   workspace pins 3.25.76 in server/shared/mcp-server. npm reports it as ERESOLVE on
#   every worker-tarball install, which reads like a broken package and has already
#   cost one cross-machine setup a round trip.
#
#   It is a TYPE-LEVEL peer only. `zod` appears as a bare module specifier in exactly
#   one file of the shipped SDK — sdk.d.ts, a declaration file. No runtime .mjs/.js in
#   the SDK imports it; they duck-type schemas by name ("ZodString",
#   ZodFirstPartyTypeKind), so zod 3 vs 4 cannot change execution. Nothing here passes
#   a zod schema into the SDK either: no file importing claude-agent-sdk also imports
#   zod, and tsc is clean.
#
#   So this suppresses a verified-false alarm rather than papering over a real one.
#   Re-check if the SDK starts importing zod at runtime, or if board code begins
#   handing zod schemas to it — then the honest fix is the zod 4 migration, not this.
peerDependencyRules:
  allowedVersions:
    "@anthropic-ai/claude-agent-sdk>zod": "3.25.76"
