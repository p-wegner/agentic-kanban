name: arch-gate

# Makes the architecture gates actually BLOCK merges instead of only living in
# manual local commands. `pnpm check:arch` is the composite gate of record (#982):
#   - scripts/check-god-modules.mjs — god-module ceiling/cohesion (arch-review #875, #888)
#   - pnpm lint:arch — dependency-cruiser layering rules (was only in the manual
#     `pnpm check` and sat red on master for 5 days unnoticed; fixed in #981)
#   - mcp-catalog-parity.test.ts — MCP tool registration ↔ MCP_TOOL_DEFINITIONS parity
#     (#371, #390, #476). Registering an MCP tool and cataloguing it are two separate
#     edits in two different packages; nothing else links them, so this test failed
#     TWICE without being caught at the commit that broke it. Running it here means a
#     branch that adds a tool without a catalog entry fails its OWN PR check instead of
#     leaving the gate red for every later branch to inherit.
# Runs on every PR into master and on direct pushes to master. Enable branch
# protection on `master` requiring this check so a breach cannot land — which is
# exactly the failure #888 documented (a 1042-line file merged past a red gate).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # #765: lets anyone produce the lcov artifact on demand without waiting for a push
  # to master — the coverage job below is the only consumer of this trigger.
  workflow_dispatch:

jobs:
  god-module-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The god-module gate needs `typescript` for a precise behavioral-export count
      # (regex fallback if absent), and lint:arch needs the `dependency-cruiser`
      # devDep — the full frozen install covers both.
      - run: pnpm install --frozen-lockfile
      - name: arch gates (god-module + depcruise layering + mcp-catalog parity)
        run: pnpm check:arch
      # #780 — the wire contract is compile-time only, so `openapi.yaml` was the ONE
      # artifact that described it at all. It had not been regenerated since the commit
      # that created it (2026-06-24) while 33 commits changed 33 distinct DTO files, and
      # nothing in .github/, the test tree or scripts/ referenced it. A generated artifact
      # nobody regenerates and nobody diffs is not a contract; it is a two-month-old
      # snapshot that reads like one — worse than none, because it gets cited as coverage.
      # This step regenerates in memory and fails when the committed spec disagrees.
      - name: openapi drift gate (packages/server/openapi.yaml vs the route sources)
        run: pnpm openapi:check

  # #765 — the CONSUMER for the coverage reports #688 wired up and nobody read.
  #
  # Until this job existed, `code-metrics` could not find a Cobertura/LCOV/JaCoCo report
  # anywhere in the tree (`provenance.scanners.coverage = "skipped:no_report"`), so it fell
  # back to its co-change proxy for 1375 of 1375 production files — every "is this file
  # protected" number the repo produced meant "was it ever committed alongside a test file".
  # That proxy is measurably wrong in the direction that matters: GraphEdges.tsx scored
  # safety_net 0.00 on it and measures 88% line coverage.
  #
  # DELIBERATELY NOT on pull_request. A full-repo coverage run is the whole test suite
  # (~4,100 server tests that spawn real git/node children, plus the client's 1,541), and
  # this repo's vitest configs exist mostly to document how badly that suite fails under
  # load (#206, #680: timeouts turning a green tree into a red merge gate board-wide). A
  # coverage number is worth having; it is not worth withholding every merge for. On push
  # to master and on workflow_dispatch its redness is informational, never merge-blocking.
  # Flipping it to PRs is a one-line change once someone has MEASURED the run on a CI
  # runner — do not do it on the strength of a local timing.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build shared (several server suites assert against packages/shared/dist)
        run: pnpm build:shared
      - name: coverage run (all four test packages)
        # `pnpm <pkg> test -- --coverage` does NOT work: pnpm swallows everything after
        # `--`, so the old script ran the plain suite four times and emitted no report at
        # all. `exec vitest run --coverage` is the form that reaches vitest.
        run: pnpm test:coverage
      - name: read the reports (fails if any package emitted none)
        run: pnpm coverage:report
      - name: merge the four lcovs into one repo-anchored report (#797)
        # `code-metrics analyze --coverage <path>` takes exactly ONE report, and each
        # package's lcov is package-relative, so a naive `cat` makes `src/lib/x.ts`
        # ambiguous across four packages. `--merge` re-anchors every SF: to the repo root.
        # Without this the analyzer can only ever measure one package and leaves the other
        # three on the co-change proxy — which is the state #797 existed to end.
        run: pnpm coverage:merge
      - name: per-package floor ratchet (#902 — signal only, does not fail the job)
        # #807 rejected a flat --min floor: mcp-server (48.85%) and client (48.98%) sit far
        # below repo-wide (71.87%), and a floor pinned to today's numbers never rises on its
        # own. This is the same shrink/grow-only ratchet shape as the repo's other guard
        # suites, applied per package, and it is a red/green SIGNAL, not a merge gate — this
        # job already runs only on push/workflow_dispatch (#807), never on pull_request.
        run: pnpm coverage:check-floors || echo "::warning::per-package coverage floor ratchet is red — see the step output above"
      - name: upload lcov + summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          # code-metrics eats lcov.info; coverage-summary.json is what
          # scripts/coverage-report.mjs reads. The HTML lcov-report/ is deliberately
          # excluded — it is ~10x the size and nothing automated reads it.
          path: |
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
            coverage/lcov.info
          # `warn`, not `error`: the reader step above is already the loud, specific
          # failure for a missing report; making the upload a second red would obscure it.
          # (#797 removed the main cause of a missing report — every package now sets
          # `coverage.reportOnFailure: true`, so a red suite still emits its numbers. A
          # report can still be absent if the run dies before the reporting phase, which
          # was observed once on a 732-file server run.)
          if-no-files-found: warn
          retention-days: 14
